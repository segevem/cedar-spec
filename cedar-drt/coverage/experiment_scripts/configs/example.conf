# Experiment config — sourced by run_experiment.sh, aws/package_and_upload.sh,
# and aws/launch.sh. Copy this file, edit, and pass it via CONFIG=:
#
#   CONFIG=configs/my.conf ./run_experiment.sh                 # local
#   CONFIG=configs/my.conf aws/package_and_upload.sh           # snapshot that spec version
#   CONFIG=configs/my.conf REPS=20 CONFIG=... aws/launch.sh    # EC2
#
# Precedence: environment > this file > built-in script defaults. The `:=` form
# assigns only when unset, so an env var on the command line still wins.

# ---------- what to run ----------
: "${REPS:=20}"                 # runs per approach (bootstrap sample size)
: "${RUN_SECS:=3600}"           # target collect length per rep: 3600=1h, 43200=12h
: "${DURATION:=300}"            # throughput measurement window (short; sizes N via rate)
: "${TARGET:=validation-drt}"   # validation-drt | rust-only | level-validation-drt
: "${BOOTSTRAP:=10000}"         # bootstrap resamples

# Approaches — edit freely.   "name   generator   strategy   lean_size"
#   generator: type-directed (handwritten) | lean-schema-typeof (Specimen)
#   strategy : budget-aware | steep | steep-tags | typeof-check   (Specimen variant)
APPROACHES_SET=1
APPROACHES=(
  "handwritten          type-directed       budget-aware  20"
  "steep-tags-sz12      lean-schema-typeof  steep-tags    12"
  "steep-tags-sz20      lean-schema-typeof  steep-tags    20"
  "typeof-check-sz12    lean-schema-typeof  typeof-check  12"
  "typeof-check-sz20    lean-schema-typeof  typeof-check  20"
)

# ---------- which spec version to build ----------
# Point these at a git worktree / alternate checkout to run a DIFFERENT version
# of the relational spec or Specimen. package_and_upload.sh snapshots exactly
# these (including uncommitted changes) into the required layout.
: "${CEDAR_SPEC_DIR:=/local/home/segevem/cedar-spec}"
: "${SPECIMEN_DIR:=/local/home/segevem/specimen}"
: "${CEDAR_DIR:=/local/home/segevem/cedar}"

# ---------- storage / infra ----------
: "${STORAGE:=s3}"              # s3 | local  (local path runs use OUT=)
: "${BUCKET:=__S3_BUCKET__}"
: "${SEED_BASE:=0}"
# : "${INSTANCE_TYPE:=c7i.48xlarge}"   # uncomment to override EC2 auto-sizing
